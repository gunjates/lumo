<!-- Sign In Page -->
<div class="signin-container">
  <!-- Left Side - Image -->
  <div class="signin-image">
    <div class="image-wrapper">
      <img 
        src="../../../../assets/pretty-girl-sitting-shopping-cart.png" 
        alt="Shopping Experience" 
        class="signin-hero-image"
      >
    </div>
    <div class="image-overlay">
      <h2 class="welcome-text">Welcome Back!</h2>
      <p class="welcome-subtitle">Sign in to continue your shopping journey</p>
    </div>
  </div>

  <!-- Right Side - Sign In Form -->
  <div class="signin-form-container">
    <div class="signin-form-wrapper">
      <!-- Header -->
      <div class="form-header">
        <h1 class="form-title">Sign In</h1>
        <p class="form-subtitle">Enter your credentials to access your account</p>
      </div>

      <!-- Sign In Form -->
      <form [formGroup]="signinForm" (ngSubmit)="onSubmit()" class="signin-form">
        <!-- Username/Email Field -->
        <div class="form-group">
          <label for="username">Username *</label>
          <input
            id="username"
            type="text"
            placeholder="Mobile No or email"
            formControlName="username"
            class="form-control"
          />
          <div *ngIf="usernameError" class="error-message">{{ usernameError }}</div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password *</label>
          <div class="password-input-wrapper">
            <input
              id="password"
            [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
            formControlName="password"
              class="form-control password-input"
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg 
                *ngIf="!showPassword" 
                width="20" 
                height="20" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg 
                *ngIf="showPassword" 
                width="20" 
                height="20" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="2"
              >
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div *ngIf="passwordError" class="error-message">{{ passwordError }}</div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="checkbox-container">
            <input 
              type="checkbox" 
              [checked]="rememberMe"
              (change)="onRememberMeChange($event)"
            >
            <span class="checkmark"></span>
            <span class="checkbox-label">Remember Me</span>
          </label>
          
          <a href="#" class="forgot-password-link">Forgot Password?</a>
        </div>

        <!-- Sign In Button -->
        <div class="form-actions">
          <app-button
            text="Sign In"
            type="submit"
            variant="primary"
            size="lg"
            [fullWidth]="true"
            [disabled]="signinForm.invalid"
          ></app-button>
        </div>

        <!-- Divider -->
        <div class="divider">
          <span class="divider-text">or</span>
        </div>

        <!-- Social Sign In (Optional) -->
        <div class="social-signin">
          <app-button
            text="Continue with Google"
            variant="outline"
            size="lg"
            [fullWidth]="true"
            icon="search"
          ></app-button>
        </div>
      </form>

      <!-- Sign Up Link -->
      <div class="signup-link">
        <p>Don't have an account? 
          <a routerLink="/auth/signup" class="signup-link-text">Sign Up</a>
        </p>
      </div>
    </div>
  </div>
</div>
