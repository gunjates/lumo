<!-- Header Component -->
<header class="header">
  <div class="container">
    <!-- Logo and Brand -->
    <div class="brand">
      <a routerLink="/" class="logo">
        <span class="logo-text">Lumo</span>
      </a>
    </div>

    <!-- Navigation Menu -->
    <nav class="nav" [class.nav-open]="isMenuOpen">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" 
             class="nav-link" (click)="closeMenu()">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/products" routerLinkActive="active" 
             class="nav-link" (click)="closeMenu()">
            Products
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/categories" routerLinkActive="active" 
             class="nav-link" (click)="closeMenu()">
            Categories
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/about" routerLinkActive="active" 
             class="nav-link" (click)="closeMenu()">
            About
          </a>
        </li>
      </ul>
    </nav>

    <!-- User Actions -->
    <div class="user-actions">
      <!-- Search -->
      <div class="search-container">
        <input type="text" placeholder="Search products..." class="search-input">
        <button class="search-btn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
      </div>

      <!-- Cart -->
      <button class="cart-btn" routerLink="/cart" aria-label="Shopping Cart">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="m1 1 4 4 13 0 4 13-1 1H6"></path>
        </svg>
        <span class="cart-count">0</span>
      </button>

      <!-- User Account -->
      <div class="user-menu">
        <button class="user-btn" aria-label="User Account">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
        <span class="hamburger" [class.active]="isMenuOpen"></span>
      </button>
    </div>
  </div>
</header>
