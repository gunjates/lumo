<!-- Main App Layout -->
<div class="app-container">
  <!-- Loading State -->
  <div *ngIf="!(navigationContent$ | async)" class="loading-container">
    <div class="loading-spinner"></div>
    <p>Loading...</p>
  </div>

  <!-- Main Content -->
  <div *ngIf="navigationContent$ | async as navContent">
    <!-- Header/Navigation -->
    <header class="app-header">
      <nav class="navbar">
        <div class="navbar-brand">
          <div class="navbar-logo" [style.background-image]="'url(' + navContent.brand.logo.url + ')'"></div>
          <h1>{{ navContent.brand.name }}</h1>
        </div>
        <div class="navbar-nav">
          <a *ngFor="let item of navContent.menuItems" 
             [routerLink]="item.route" 
             class="nav-link">
            {{ item.text }}
          </a>
        </div>
      </nav>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-content">
        <p>{{ navContent.footer.copyright }}</p>
        <div class="footer-links">
          <a *ngFor="let link of navContent.footer.links" 
             [routerLink]="link.route">
            {{ link.text }}
          </a>
        </div>
      </div>
    </footer>
  </div>
</div>
