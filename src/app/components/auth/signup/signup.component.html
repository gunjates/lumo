<!-- Sign Up Page -->
<div class="signup-container">
  <!-- Left Side - Sign Up Form -->
  <div class="signup-form-container">
    <div class="signup-form-wrapper">
      <!-- Header -->
      <div class="form-header">
        <h1 class="form-title">Sign Up</h1>
        <p class="form-subtitle">Create your account to start shopping</p>
      </div>

      <!-- Sign Up Form -->
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
        <!-- Form Error -->
        <div *ngIf="formError" class="form-error-message">
          {{ formError }}
        </div>

        <!-- Name Fields Row -->
        <div class="form-row">
          <!-- First Name Field -->
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input
              id="firstName"
              type="text"
              placeholder="Enter your first name"
              formControlName="firstName"
              class="form-control"
            />
            <div *ngIf="firstNameError" class="error-message">{{ firstNameError }}</div>
          </div>

          <!-- Last Name Field -->
          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input
              id="lastName"
              type="text"
              placeholder="Enter your last name"
              formControlName="lastName"
              class="form-control"
            />
            <div *ngIf="lastNameError" class="error-message">{{ lastNameError }}</div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            placeholder="Enter your email address"
            formControlName="email"
            class="form-control"
          />
          <div *ngIf="emailError" class="error-message">{{ emailError }}</div>
        </div>

        <!-- Phone Field -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="phone-input-wrapper">
            <select 
              class="country-code-select"
              (change)="onCountryCodeChange($event)"
              [value]="selectedCountryCode"
            >
              <option *ngFor="let country of countryCodes" [value]="country.code">
                {{ country.flag }} {{ country.code }}
              </option>
            </select>
            <input
              id="phone"
              type="tel"
              placeholder="Enter your phone number"
              formControlName="phone"
              class="form-control phone-input"
            />
          </div>
          <div *ngIf="phoneError" class="error-message">{{ phoneError }}</div>
        </div>

        <!-- Password Fields Row -->
        <div class="form-row">
          <!-- Password Field -->
          <div class="form-group">
            <label for="password">Password *</label>
            <div class="password-input-wrapper">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Enter your password"
                formControlName="password"
                class="form-control password-input"
              />
              <button
                type="button"
                class="password-toggle-btn"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              >
                <svg 
                  *ngIf="!showPassword" 
                  width="20" 
                  height="20" 
                  viewBox="0 0 24 24" 
                  fill="none" 
                  stroke="currentColor" 
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg 
                  *ngIf="showPassword" 
                  width="20" 
                  height="20" 
                  viewBox="0 0 24 24" 
                  fill="none" 
                  stroke="currentColor" 
                  stroke-width="2"
                >
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <div *ngIf="passwordError" class="error-message">{{ passwordError }}</div>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="confirmPassword">Confirm Password *</label>
            <div class="password-input-wrapper">
              <input
                id="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
                placeholder="Confirm your password"
                formControlName="confirmPassword"
                class="form-control password-input"
              />
              <button
                type="button"
                class="password-toggle-btn"
                (click)="toggleConfirmPasswordVisibility()"
                [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
              >
                <svg 
                  *ngIf="!showConfirmPassword" 
                  width="20" 
                  height="20" 
                  viewBox="0 0 24 24" 
                  fill="none" 
                  stroke="currentColor" 
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg 
                  *ngIf="showConfirmPassword" 
                  width="20" 
                  height="20" 
                  viewBox="0 0 24 24" 
                  fill="none" 
                  stroke="currentColor" 
                  stroke-width="2"
                >
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <div *ngIf="confirmPasswordError" class="error-message">{{ confirmPasswordError }}</div>
          </div>
        </div>

        <!-- Sign Up Button -->
        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary btn-lg btn-full-width"
            [disabled]="signupForm.invalid"
          >
            Create Account
          </button>
        </div>

        <!-- Divider -->
        <div class="divider">
          <span class="divider-text">or</span>
        </div>

        <!-- Social Sign Up (Optional) -->
        <div class="social-signup">
          <button
            type="button"
            class="btn btn-outline btn-lg btn-full-width"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
            </svg>
            Continue with Google
          </button>
        </div>
      </form>

      <!-- Sign In Link -->
      <div class="signin-link">
        <p>Already have an account? 
          <a routerLink="/auth/signin" class="signin-link-text">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side - Image -->
  <div class="signup-image">
    <div class="image-wrapper">
      <img 
        src="../../../../assets/two-cheerful-girls-sweaters-having-fun-together-with-shopping-trolley.png" 
        alt="Happy Shopping Experience" 
        class="signup-hero-image"
      >
      <div class="image-overlay">
        <h2 class="welcome-text">Join Our Community!</h2>
        <p class="welcome-subtitle">Start your shopping journey with us today</p>
      </div>
    </div>
  </div>
</div>
